aid: regression-games
name: Regression Games
description: >-
  Regression Games builds AI agents and bots for video games. Its platform lets
  studios create bots for QA testing, multiplayer simulation, game balancing,
  and NPC behavior with minimal code. The Unity SDK (gg.regression.unity.bots /
  RGUnityBots) adds AI-driven automated playtesting, UI and screenshot
  regression testing, replay and validation, and CI/CD integration for Unity
  projects, while the earlier rg-bot JavaScript/TypeScript/Python libraries let
  developers program bots for Minecraft and Capture-the-Flag tournaments.
  Distribution is via open-source SDKs and templates on GitHub rather than a
  hosted public REST API. Backed by a16z and NEA ($4.2M seed, 2022).
